backend:
  name: github
  repo: ocojer/jorarebooks
  branch: main

media_folder: ""
public_folder: "/"

collections:
  - name: "homepage"
    label: "Homepage"
    files:
      - name: "hero_and_intro"
        label: "Hero Image & Intro Text"
        file: "content/homepage.json"
        fields:
          - label: "Hero Photo"
            name: "hero_image"
            widget: "image"
            hint: "The large photo at the top of the homepage."
          - label: "Hero Photo alt text"
            name: "hero_alt"
            widget: "string"
            required: false
            hint: "A short description of the photo, for accessibility and search engines."
          - label: "Intro paragraphs"
            name: "intro_paragraphs"
            widget: "list"
            hint: "One entry per paragraph. Use the + button to add another, or the trash icon to remove one."
          - label: "Sign-off"
            name: "signoff"
            widget: "string"
            required: false
            hint: "Sits right-aligned below the intro, e.g. — Jeremy"

      - name: "coming_soon"
        label: "Further Holdings / Coming Soon Text"
        file: "content/coming-soon.json"
        fields:
          - label: "Note"
            name: "note"
            widget: "string"
            hint: "Short line above the Coming Soon paragraph, e.g. Further holdings available. Inquiries welcome."
          - label: "Coming soon text"
            name: "coming_soon_text"
            widget: "text"
            hint: "Wrap any phrase in <strong> and </strong> to bold it, e.g. <strong>An archive documenting...</strong>"

      - name: "site_info"
        label: "Contact &amp; Site Info"
        file: "content/site-info.json"
        fields:
          - label: "Phone (digits only, e.g. +12125551234)"
            name: "phone"
            widget: "string"
            required: false
            hint: "Used in the tel: link. Leave blank to hide the phone number."
          - label: "Phone (display format, e.g. 212-555-1234)"
            name: "phone_display"
            widget: "string"
            required: false
          - label: "Email"
            name: "email"
            widget: "string"
            default: "info@jorarebooks.com"
          - label: "Shipping note"
            name: "shipping_note"
            widget: "string"
            default: "Free shipping within the US"
            hint: "Shown beside the price on item pages."
          - label: "Returns note"
            name: "returns_note"
            widget: "string"
            required: false
            hint: "Optional — shown on item pages if set."

  - name: "holdings"
    label: "Current Holdings"
    label_singular: "Holding"
    folder: "content/holdings"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Plain text. Wrap a book title in <em> and </em> to italicize it, e.g. <em>Harry Potter and the Philosopher's Stone</em>"
      - label: "Contents (optional)"
        name: "contents"
        widget: "text"
        required: false
        hint: "Physical extent, shown beneath the title on the story page, e.g. \"2,868 manuscript pages in 23 volumes; with additional materials housed in 12 boxes.\" Can run to more than one paragraph — separate them with a blank line."
      - label: "Description"
        name: "description"
        widget: "text"
        hint: "Shows as the card blurb on the homepage. On the story page (if there's a slug below), this also becomes the opening text next to the PDF — separate paragraphs with a blank line between them."
      - label: "Photo"
        name: "image"
        widget: "image"
        hint: "Upload a photo of the item. If left blank, the card shows a plain color block instead."
        required: false
      - label: "Photo alt text"
        name: "alt"
        widget: "string"
        hint: "A short description of the photo, for accessibility and search engines."
        required: false
      - label: "Hero caption (optional)"
        name: "hero_caption"
        widget: "string"
        required: false
        hint: "Shown under the hero image (or video, if set below) on the story page. A sentence or two is fine."
      - label: "Price or availability note"
        name: "price"
        widget: "string"
        default: "Inquire"
        hint: "Shown only if there's no PDF or video below — otherwise those replace it."
      - label: "PDF"
        name: "pdf_url"
        widget: "file"
        required: false
        hint: "Upload a PDF (condition report, provenance, etc). If set, shows as \"View PDF\" instead of the price/inquire line."
      - label: "PDF cover image (optional)"
        name: "pdf_cover_image"
        widget: "image"
        required: false
        hint: "Only used on the story page — if set (and a PDF is linked above), shows the cover alongside the story text with its own download link. Leave blank to skip this."
      - label: "What the PDF contains (optional)"
        name: "pdf_caption"
        widget: "string"
        required: false
        hint: "A short line under the PDF link on the story page, e.g. \"Complete archive description, correspondence, and formal bibliographic listing.\" Makes clear the story text is a shorter version and the PDF is the full record. Leave blank to skip."
      - label: "Video (optional)"
        name: "video_url"
        widget: "string"
        required: false
        hint: "Link to a video (e.g. YouTube). Shows as \"Video\" instead of the price/inquire line, and on the story page takes the hero spot in place of the photo."
      - label: "Pull Quote (optional)"
        name: "pull_quote"
        widget: "string"
        required: false
        hint: "A short standout line shown in italic on the shop item page, after the first paragraph. Don't include the quotation marks — they're added automatically."
      - label: "Pull Quote Attribution (optional)"
        name: "pull_quote_attribution"
        widget: "string"
        required: false
        hint: "e.g. Jasper Johns to Véra Russell, 12 February 1975"
      - label: "Display order"
        name: "order"
        widget: "number"
        hint: "Lower numbers show first. Use 1, 2, 3... to set the sequence."
        default: 10
      - label: "Link (optional)"
        name: "url"
        widget: "string"
        required: false
        hint: "Only used if there's no story page slug below. Leave as # until then."
        default: "#"
      - label: "Story page slug (optional)"
        name: "slug"
        widget: "string"
        required: false
        hint: "Gives this holding its own page, e.g. \"harry-potter\" makes jorarebooks.com/harry-potter/. Leave blank if it shouldn't have one yet. Use lowercase letters, numbers, and hyphens only — no spaces."
      - label: "Highlights section label"
        name: "highlights_label"
        widget: "string"
        required: false
        default: "Highlights from the archive"
        hint: "The heading shown above the highlights below — change it per holding if you want something other than the default, e.g. \"From the collection.\" Only shown if there's at least one highlight below."
      - label: "Highlights"
        name: "story_body"
        widget: "list"
        required: false
        hint: "Each block is one highlight — a distinct facet of the archive. Add a heading to start a new highlight (this is what puts a break above it); leave heading blank to continue the previous one. Typical shape per block: heading, image + a short caption describing it, then a longer paragraph or two of context. Within one block, fields always render in that fixed order (heading, image, caption, paragraph, quote) — to put a pull-quote somewhere else, like between two paragraphs, split it into extra blocks with the heading left blank: e.g. one block with the first paragraph, a second block with just the quote filled in, a third block with the rest of the paragraphs. They'll flow together as one highlight with no break between them, in whatever order you stack the blocks. Only used if a slug is set above."
        fields:
          - {label: "Heading", name: "heading", widget: "string", required: false, hint: "Names this highlight, e.g. \"Casting materials\" or \"Correspondence.\" Leave blank to add more to the previous highlight instead of starting a new one."}
          - {label: "Image", name: "image", widget: "image", required: false}
          - {label: "Image alt text", name: "image_alt", widget: "string", required: false}
          - {label: "Image caption", name: "image_caption", widget: "string", required: false, hint: "A short, factual line describing the image itself — what it is. Save the fuller story for the paragraph below."}
          - {label: "Paragraph", name: "text", widget: "text", required: false, hint: "The context or story behind this highlight. Can run to more than one paragraph — separate them with a blank line."}
          - {label: "Pull-quote (optional)", name: "quote", widget: "text", required: false, hint: "A short standout line, shown larger and set apart. Include attribution in the text itself if needed. Renders after the paragraph above — use a separate block (heading left blank) to place it somewhere else, like between two paragraphs."}
      - label: "Additional photos (optional)"
        name: "gallery"
        widget: "list"
        required: false
        hint: "Extra photos shown further down the story page, each with its own caption."
        fields:
          - {label: "Photo", name: "image", widget: "image"}
          - {label: "Photo alt text", name: "alt", widget: "string", required: false}
          - {label: "Caption", name: "caption", widget: "string", required: false}

  - name: "sections"
    label: "Feature Sections"
    label_singular: "Section"
    folder: "content/sections"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{order}} — {{caption}}"
    fields:
      - label: "Photo"
        name: "image"
        widget: "image"
        hint: "A wide photo — spans the same width as the Featured holdings grid above it."
      - label: "Photo alt text"
        name: "alt"
        widget: "string"
        required: false
        hint: "A short description of the photo, for accessibility and search engines."
      - label: "Caption"
        name: "caption"
        widget: "string"
        required: false
        hint: "A short line under the photo."
      - label: "Description"
        name: "description"
        widget: "text"
        required: false
        hint: "Longer text below the caption."
      - label: "Display order"
        name: "order"
        widget: "number"
        hint: "Lower numbers show first when there's more than one section — each stacks below the one before it."
        default: 10
