backend:
  name: github
  repo: ocojer/jorarebooks
  branch: main

media_folder: ""
public_folder: "/"

collections:
  - name: "homepage"
    label: "Homepage"
    files:
      - name: "hero_and_intro"
        label: "Hero Image & Intro Text"
        file: "content/homepage.json"
        fields:
          - label: "Hero Photo"
            name: "hero_image"
            widget: "image"
            hint: "The large photo at the top of the homepage."
          - label: "Hero Photo alt text"
            name: "hero_alt"
            widget: "string"
            required: false
            hint: "A short description of the photo, for accessibility and search engines."
          - label: "Intro paragraphs"
            name: "intro_paragraphs"
            widget: "list"
            hint: "One entry per paragraph. Use the + button to add another, or the trash icon to remove one."
          - label: "Sign-off"
            name: "signoff"
            widget: "string"
            required: false
            hint: "Sits right-aligned below the intro, e.g. — Jeremy"

  - name: "holdings"
    label: "Current Holdings"
    label_singular: "Holding"
    folder: "content/holdings"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Plain text. Wrap a book title in <em> and </em> to italicize it, e.g. <em>Harry Potter and the Philosopher's Stone</em>"
      - label: "Description"
        name: "description"
        widget: "text"
      - label: "Photo"
        name: "image"
        widget: "image"
        hint: "Upload a photo of the item. If left blank, the card shows a plain color block instead."
        required: false
      - label: "Photo alt text"
        name: "alt"
        widget: "string"
        hint: "A short description of the photo, for accessibility and search engines."
        required: false
      - label: "Price or availability note"
        name: "price"
        widget: "string"
        default: "Inquire"
        hint: "Shown only if there's no PDF or video below — otherwise those replace it."
      - label: "PDF (optional)"
        name: "pdf_url"
        widget: "string"
        required: false
        hint: "Link to a PDF (condition report, provenance, etc). If set, shows as \"View PDF\" instead of the price/inquire line."
      - label: "Video (optional)"
        name: "video_url"
        widget: "string"
        required: false
        hint: "Link to a video (e.g. YouTube). If set, shows as \"Video\" instead of the price/inquire line."
      - label: "Display order"
        name: "order"
        widget: "number"
        hint: "Lower numbers show first. Use 1, 2, 3... to set the sequence."
        default: 10
      - label: "Link (optional)"
        name: "url"
        widget: "string"
        required: false
        hint: "Leave as # until this holding has its own story page."
        default: "#"

  - name: "sections"
    label: "Feature Sections"
    label_singular: "Section"
    folder: "content/sections"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{order}} — {{caption}}"
    fields:
      - label: "Photo"
        name: "image"
        widget: "image"
        hint: "A wide photo — spans the same width as the Featured holdings grid above it."
      - label: "Photo alt text"
        name: "alt"
        widget: "string"
        required: false
        hint: "A short description of the photo, for accessibility and search engines."
      - label: "Caption"
        name: "caption"
        widget: "string"
        required: false
        hint: "A short line under the photo."
      - label: "Description"
        name: "description"
        widget: "text"
        required: false
        hint: "Longer text below the caption."
      - label: "Display order"
        name: "order"
        widget: "number"
        hint: "Lower numbers show first when there's more than one section — each stacks below the one before it."
        default: 10
