backend:
  name: github
  repo: ocojer/jorarebooks
  branch: main

media_folder: ""
public_folder: "/"

collections:
  - name: "homepage"
    label: "Homepage"
    files:
      - name: "hero_and_intro"
        label: "Hero Image & Intro Text"
        file: "content/homepage.json"
        fields:
          - label: "Hero Photo"
            name: "hero_image"
            widget: "image"
            hint: "The large photo at the top of the homepage."
          - label: "Hero Photo alt text"
            name: "hero_alt"
            widget: "string"
            required: false
            hint: "A short description of the photo, for accessibility and search engines."
          - label: "Intro paragraphs"
            name: "intro_paragraphs"
            widget: "list"
            hint: "One entry per paragraph. Use the + button to add another, or the trash icon to remove one."
          - label: "Sign-off"
            name: "signoff"
            widget: "string"
            required: false
            hint: "Sits right-aligned below the intro, e.g. — Jeremy"

      - name: "coming_soon"
        label: "Further Holdings / Coming Soon Text"
        file: "content/coming-soon.json"
        fields:
          - label: "Note"
            name: "note"
            widget: "string"
            hint: "Short line above the Coming Soon paragraph, e.g. Further holdings available. Inquiries welcome."
          - label: "Coming soon text"
            name: "coming_soon_text"
            widget: "text"
            hint: "Wrap any phrase in <strong> and </strong> to bold it, e.g. <strong>An archive documenting...</strong>"

      - name: "site_info"
        label: "Contact &amp; Site Info"
        file: "content/site-info.json"
        fields:
          - label: "Phone (digits only, e.g. +12125551234)"
            name: "phone"
            widget: "string"
            required: false
            hint: "Used in the tel: link. Leave blank to hide the phone number."
          - label: "Phone (display format, e.g. 212-555-1234)"
            name: "phone_display"
            widget: "string"
            required: false
          - label: "Email"
            name: "email"
            widget: "string"
            default: "info@jorarebooks.com"
          - label: "Shipping note"
            name: "shipping_note"
            widget: "string"
            default: "Free shipping within the US"
            hint: "Shown beside the price on item pages."
          - label: "Returns note"
            name: "returns_note"
            widget: "string"
            required: false
            hint: "Optional — shown on item pages if set."

  - name: "holdings"
    label: "Current Holdings"
    label_singular: "Holding"
    folder: "content/holdings"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Plain text. Wrap a book title in <em> and </em> to italicize it, e.g. <em>Harry Potter and the Philosopher's Stone</em>"
      - label: "Description"
        name: "description"
        widget: "text"
      - label: "Photo"
        name: "image"
        widget: "image"
        hint: "Upload a photo of the item. If left blank, the card shows a plain color block instead."
        required: false
      - label: "Photo alt text"
        name: "alt"
        widget: "string"
        hint: "A short description of the photo, for accessibility and search engines."
        required: false
      - label: "Price or availability note"
        name: "price"
        widget: "string"
        default: "Inquire"
        hint: "Shown only if there's no PDF or video below — otherwise those replace it."
      - label: "PDF (optional)"
        name: "pdf_url"
        widget: "string"
        required: false
        hint: "Link to a PDF (condition report, provenance, etc). If set, shows as \"View PDF\" instead of the price/inquire line."
      - label: "PDF cover image (optional)"
        name: "pdf_cover_image"
        widget: "image"
        required: false
        hint: "Only used on the story page — if set (and a PDF is linked above), shows the cover alongside the story text with its own download link. Leave blank to skip this."
      - label: "What the PDF contains (optional)"
        name: "pdf_caption"
        widget: "string"
        required: false
        hint: "A short line under the PDF link on the story page, e.g. \"Complete archive description, correspondence, and formal bibliographic listing.\" Makes clear the story text is a shorter version and the PDF is the full record. Leave blank to skip."
      - label: "Video (optional)"
        name: "video_url"
        widget: "string"
        required: false
        hint: "Link to a video (e.g. YouTube). If set, shows as \"Video\" instead of the price/inquire line."
      - label: "Pull Quote (optional)"
        name: "pull_quote"
        widget: "string"
        required: false
        hint: "A short standout line shown in italic on the shop item page, after the first paragraph. Don't include the quotation marks — they're added automatically."
      - label: "Pull Quote Attribution (optional)"
        name: "pull_quote_attribution"
        widget: "string"
        required: false
        hint: "e.g. Jasper Johns to Véra Russell, 12 February 1975"
      - label: "Display order"
        name: "order"
        widget: "number"
        hint: "Lower numbers show first. Use 1, 2, 3... to set the sequence."
        default: 10
      - label: "Link (optional)"
        name: "url"
        widget: "string"
        required: false
        hint: "Only used if there's no story page slug below. Leave as # until then."
        default: "#"
      - label: "Story page slug (optional)"
        name: "slug"
        widget: "string"
        required: false
        hint: "Gives this holding its own page, e.g. \"harry-potter\" makes jorarebooks.com/harry-potter/. Leave blank if it shouldn't have one yet. Use lowercase letters, numbers, and hyphens only — no spaces."
      - label: "Story page text"
        name: "story_body"
        widget: "list"
        required: false
        hint: "Add blocks in order, top to bottom, in whatever mix the piece calls for. Each block can be a heading, a paragraph, a pull-quote, or an image — fill in only the one you want for that block, leave the others blank. Only used if a slug is set above."
        fields:
          - {label: "Heading (optional)", name: "heading", widget: "string", required: false, hint: "A short section title, e.g. \"The Collaborators\""}
          - {label: "Paragraph (optional)", name: "text", widget: "text", required: false}
          - {label: "Pull-quote (optional)", name: "quote", widget: "text", required: false, hint: "A short standout line, shown larger and set apart. Include attribution in the text itself if needed."}
          - {label: "Image (optional)", name: "image", widget: "image", required: false, hint: "Drops a photo in at this point in the story, right where it's relevant."}
          - {label: "Image alt text (optional)", name: "image_alt", widget: "string", required: false}
          - {label: "Image caption (optional)", name: "image_caption", widget: "string", required: false}
      - label: "Additional photos (optional)"
        name: "gallery"
        widget: "list"
        required: false
        hint: "Extra photos shown further down the story page, each with its own caption."
        fields:
          - {label: "Photo", name: "image", widget: "image"}
          - {label: "Photo alt text", name: "alt", widget: "string", required: false}
          - {label: "Caption", name: "caption", widget: "string", required: false}

  - name: "sections"
    label: "Feature Sections"
    label_singular: "Section"
    folder: "content/sections"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{order}} — {{caption}}"
    fields:
      - label: "Photo"
        name: "image"
        widget: "image"
        hint: "A wide photo — spans the same width as the Featured holdings grid above it."
      - label: "Photo alt text"
        name: "alt"
        widget: "string"
        required: false
        hint: "A short description of the photo, for accessibility and search engines."
      - label: "Caption"
        name: "caption"
        widget: "string"
        required: false
        hint: "A short line under the photo."
      - label: "Description"
        name: "description"
        widget: "text"
        required: false
        hint: "Longer text below the caption."
      - label: "Display order"
        name: "order"
        widget: "number"
        hint: "Lower numbers show first when there's more than one section — each stacks below the one before it."
        default: 10
