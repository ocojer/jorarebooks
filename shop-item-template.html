<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- ITEM_TITLE --> — Jeremy O'Connor, Books &amp; Manuscripts</title>
  <meta name="description" content="<!-- ITEM_SEO_DESC -->">
  <link rel="canonical" href="<!-- ITEM_CANONICAL -->">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ffffff'/><text y='50' font-size='62' font-family='Georgia,serif' fill='%23111111' x='50' text-anchor='middle' dominant-baseline='central'>J</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- MASTHEAD -->

  <!-- INQUIRE MODAL -->
  <div class="modal-overlay" id="inquire-modal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
      <div class="modal-title">Inquire</div>
      <div class="modal-item" id="modal-item-title"></div>
      <div id="modal-form-wrap">
        <form name="inquire" method="POST" data-netlify="true" onsubmit="handleModalSubmit(event)">
          <input type="hidden" name="form-name" value="inquire">
          <input type="hidden" name="item" id="modal-item-field">
          <div class="modal-field">
            <label class="modal-label" for="modal-name">Name</label>
            <input class="modal-input" type="text" id="modal-name" name="name" required>
          </div>
          <div class="modal-field">
            <label class="modal-label" for="modal-email">Email</label>
            <input class="modal-input" type="email" id="modal-email" name="email" required>
          </div>
          <div class="modal-field">
            <label class="modal-label" for="modal-message">Message (optional)</label>
            <textarea class="modal-textarea" id="modal-message" name="message" placeholder="Any questions or additional context..."></textarea>
          </div>
          <button class="modal-submit" type="submit">Send Inquiry</button>
          <p class="modal-note">We'll respond within one business day.</p>
        </form>
      </div>
      <div class="modal-success" id="modal-success" style="display:none;">
        <div class="modal-success-title">Thank you.</div>
        <div class="modal-success-msg">Your inquiry has been sent. We'll be in touch shortly.</div>
      </div>
    </div>
  </div>

  <div class="shop-page">

    <div class="shop-item-breadcrumb">
      <a href="/">Home</a>
      <span class="breadcrumb-sep">→</span>
      <a href="/shop/">Shop</a>
      <span class="breadcrumb-sep">→</span>
      <!-- ITEM_BREADCRUMB_CATEGORY -->
      <span class="breadcrumb-sep">→</span>
      <span><!-- ITEM_BREADCRUMB_TITLE --></span>
    </div>

    <div class="shop-item-layout">

      <!-- THUMB STRIP -->
      <div class="shop-item-thumbs">
        <!-- ITEM_THUMBS -->
      </div>

      <!-- MAIN IMAGE -->
      <div class="shop-item-image-wrap">
        <div class="shop-item-main-image">
          <!-- ITEM_MAIN_IMAGE -->
        </div>
      </div>

      <!-- TEXT COLUMN -->
      <div class="shop-item-detail">

        <div class="shop-item-category"><!-- ITEM_CATEGORY --></div>
        <div class="shop-item-author"><!-- ITEM_AUTHOR --></div>
        <h1 class="shop-item-title"><!-- ITEM_TITLE_DISPLAY --></h1>
        <div class="shop-item-place-date"><!-- ITEM_PLACE_DATE --></div>

        <div class="shop-item-price-row">
          <span class="shop-item-price"><!-- ITEM_PRICE --></span>
          <!-- ITEM_PRICE_NOTE -->
        </div>

        <div class="shop-item-actions">
          <!-- ITEM_ACTIONS -->
        </div>

        <hr class="shop-item-desc-rule">

        <!-- ITEM_DESCRIPTION_BODY -->

      </div>
    </div>

    <!-- ITEM_RELATED -->

    <!-- FOOTER -->

  </div>

  <script>
    function switchImage(src, alt, thumb) {
      document.querySelector('.shop-item-main-image img').src = src;
      document.querySelector('.shop-item-main-image img').alt = alt;
      document.querySelectorAll('.shop-item-thumb').forEach(t => t.classList.remove('active'));
      thumb.classList.add('active');
    }

    function openModal(itemTitle) {
      document.getElementById('modal-item-title').textContent = itemTitle;
      document.getElementById('modal-item-field').value = itemTitle;
      document.getElementById('modal-success').style.display = 'none';
      document.getElementById('modal-form-wrap').style.display = '';
      document.getElementById('inquire-modal').classList.add('open');
      document.body.style.overflow = 'hidden';
      setTimeout(() => document.getElementById('modal-name').focus(), 100);
    }

    function closeModal() {
      document.getElementById('inquire-modal').classList.remove('open');
      document.body.style.overflow = '';
    }

    async function handleModalSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      try {
        const response = await fetch(window.location.pathname, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(data).toString()
        });
        if (response.ok) {
          document.getElementById('modal-form-wrap').style.display = 'none';
          document.getElementById('modal-success').style.display = '';
        } else {
          throw new Error('Submission failed');
        }
      } catch(err) {
        // Fallback to mailto
        const name = data.get('name') || '';
        const msg = data.get('message') || '';
        window.location.href = `mailto:info@jorarebooks.com?subject=${encodeURIComponent('Inquiry: ' + data.get('item'))}&body=${encodeURIComponent('From: ' + name + '\n\n' + msg)}`;
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>

</body>
</html>
