  <script>
    function switchImage(webpSrc, jpgSrc, alt, thumb) {
      const mainImage = document.querySelector('.shop-item-main-image');
      const source = mainImage.querySelector('source');
      const img = mainImage.querySelector('img');
      if (source) source.srcset = webpSrc;
      img.src = jpgSrc;
      img.alt = alt;
      document.querySelectorAll('.shop-item-thumb').forEach(t => t.classList.remove('active'));
      thumb.classList.add('active');
    }

    function toggleNotes(btn) {
      const body = btn.nextElementSibling;
      const open = body.classList.toggle('open');
      btn.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open);
    }
  </script>
